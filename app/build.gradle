plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.soulstream.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.soulstream.app"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "2.8"

        ndk {
            // The yt-dlp / ffmpeg / aria2c engine ships native binaries per ABI.
            // Shipping only one ABI is a top reason the engine "fails to load":
            // on any device whose ABI is not listed here the native libraries are
            // missing and init throws "failed to initialize". Include both real
            // phone ABIs (64-bit + 32-bit) so the engine loads on every handset.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    packaging {
        jniLibs {
            // Required by the yt-dlp engine: its binaries live in jniLibs and
            // must be extracted so they can be executed.
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        create("release") {
            // Stable key (committed as base64) so every future update installs
            // cleanly over the previous build.
            storeFile file("soulstream.p12")
            storePassword "soulstream2026"
            keyAlias "soulstream"
            keyPassword "soulstream2026"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            // Minification/R8 is OFF on purpose. The yt-dlp engine reaches its
            // Java/Kotlin classes through reflection (Jackson parses video info,
            // the mapper classes are instantiated dynamically), and R8 silently
            // breaks exactly that - the classic "works in debug, engine fails in
            // release" failure. The APK size is dominated by the ~57 MB of native
            // binaries, so keeping the dex unshrunk costs only a few MB and buys
            // a release build that behaves identically to debug.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.getByName("release")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.1'

    // Google Mobile Ads SDK — shows the rewarded ad before a download starts.
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
}
